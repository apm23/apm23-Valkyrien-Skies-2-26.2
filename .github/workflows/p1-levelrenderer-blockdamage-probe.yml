name: P1 LevelExtractor block-damage inspection
# Inspection-only proof for the relocated Minecraft 26.2 block-damage distance hook.
# This workflow never mutates upstream VS2 source.

on:
  push:
    paths:
      - '.github/workflows/p1-levelrenderer-blockdamage-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-level-extractor-block-damage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-level-extractor-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-level-extractor-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-level-extractor-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-level-extractor-classpath.log

      - name: Prove exact relocated block-damage distance filter
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-level-extractor-blockdamage-probe.log
          from pathlib import Path
          import re, subprocess, zipfile

          cp_log = Path('p1-level-extractor-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists() and p.suffix == '.jar': jars.append(p)
          owners = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if 'net/minecraft/client/renderer/extract/LevelExtractor.class' in set(zf.namelist()):
                          owners.append(jar)
              except zipfile.BadZipFile:
                  pass
          if len(owners) != 1:
              raise SystemExit(f'fail-closed: expected one LevelExtractor owner jar, got {len(owners)}')
          owner = owners[0]
          proc = subprocess.run(
              ['javap', '-classpath', str(owner), '-p', '-s', '-c', 'net.minecraft.client.renderer.extract.LevelExtractor'],
              text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
          )
          print(proc.stdout)
          if proc.returncode != 0:
              raise SystemExit('fail-closed: javap LevelExtractor failed')
          text = proc.stdout
          if 'public class net.minecraft.client.renderer.extract.LevelExtractor' not in text:
              raise SystemExit('fail-closed: LevelExtractor is not public/current')
          match = re.search(
              r'private void extractBlockDestroyAnimation\(net\.minecraft\.client\.Camera, net\.minecraft\.client\.renderer\.state\.level\.LevelRenderState\);.*?(?=\n  (?:public|private|protected) |\Z)',
              text,
              flags=re.S,
          )
          if not match:
              raise SystemExit('fail-closed: exact extractBlockDestroyAnimation(Camera, LevelRenderState) missing')
          body = match.group(0)
          count_1024 = body.count('double 1024.0d')
          if count_1024 != 1:
              raise SystemExit(f'fail-closed: expected exactly one 1024.0d in block-damage extractor, got {count_1024}')
          required = [
              'Camera.position:()Lnet/minecraft/world/phys/Vec3;',
              'ClientLevel.destructionProgress:',
              'BlockPos.distToCenterSqr:(DDD)D',
              'LevelRenderState.blockBreakingRenderStates:',
              'BlockBreakingRenderState."<init>"',
          ]
          missing = [token for token in required if token not in body]
          if missing:
              raise SystemExit('fail-closed: block-damage lifecycle anchors missing: ' + repr(missing))
          print('LEVEL_EXTRACTOR_BLOCK_DAMAGE_26_2_PROVEN method=extractBlockDestroyAnimation distance_call=distToCenterSqr constant_1024_count=1 state_output=blockBreakingRenderStates')
          PY

      - name: Compile scratch LevelExtractor constant mixin against exact classpath
        shell: bash
        run: |
          set -euo pipefail
          CP="$(grep '^VS_CP_FILE=' p1-level-extractor-classpath.log | cut -d= -f2- | paste -sd: -)"
          mkdir -p p1-level-extractor-scratch/probe
          cat > p1-level-extractor-scratch/probe/LevelExtractorMixinScratch.java <<'JAVA'
          package probe;

          import com.llamalad7.mixinextras.injector.ModifyExpressionValue;
          import net.minecraft.client.renderer.extract.LevelExtractor;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.injection.At;

          @Mixin(LevelExtractor.class)
          abstract class LevelExtractorMixinScratch {
              @ModifyExpressionValue(
                  method = "extractBlockDestroyAnimation",
                  at = @At(value = "CONSTANT", args = "doubleValue=1024", ordinal = 0)
              )
              private double vs$disableBlockDamageDistanceCheck(final double original) {
                  return Double.MAX_VALUE;
              }
          }
          JAVA
          javac -proc:none -cp "$CP" -d p1-level-extractor-scratch/out p1-level-extractor-scratch/probe/LevelExtractorMixinScratch.java
          echo 'LEVEL_EXTRACTOR_BLOCK_DAMAGE_26_2_SCRATCH_MIXIN_COMPILES' | tee p1-level-extractor-scratch-compile.log

      - name: Upload exact LevelExtractor block-damage proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-level-extractor-blockdamage-probe-${{ github.sha }}
          path: |
            p1-level-extractor-classpath.log
            p1-level-extractor-blockdamage-probe.log
            p1-level-extractor-scratch-compile.log
          if-no-files-found: warn
