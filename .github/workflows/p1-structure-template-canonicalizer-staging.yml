name: P1 StructureTemplate canonicalizer staging transport

on:
  push:
    paths:
      - '.github/workflows/p1-structure-template-canonicalizer-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-canonical-p1-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate validated non-workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib

          src = Path('.github/workflows/p1-compile.yml')
          text = src.read_text(encoding='utf-8')

          path_anchor = "      - 'scripts/apply_p1_explosion_client_accessor_26_2.py'\n"
          path_insert = path_anchor + "      - 'scripts/apply_p1_structure_template_value_output_26_2.py'\n"
          if text.count(path_anchor) != 1:
              raise SystemExit(f'expected one Explosion path anchor, found {text.count(path_anchor)}')
          if "scripts/apply_p1_structure_template_value_output_26_2.py" in text:
              raise SystemExit('StructureTemplate path already canonicalized')
          staged = text.replace(path_anchor, path_insert, 1)

          step_anchor = (
              "      - name: Apply traceable P1 Explosion Level client accessor overlay\n"
              "        run: python3 scripts/apply_p1_explosion_client_accessor_26_2.py upstream-vs2\n"
          )
          step_insert = step_anchor + (
              "\n"
              "      - name: Apply frozen P1 StructureTemplate ValueOutput overlay\n"
              "        run: python3 scripts/apply_p1_structure_template_value_output_26_2.py upstream-vs2\n"
          )
          if staged.count(step_anchor) != 1:
              raise SystemExit(f'expected one Explosion step anchor, found {staged.count(step_anchor)}')
          staged = staged.replace(step_anchor, step_insert, 1)

          required = {
              "      - 'scripts/apply_p1_structure_template_value_output_26_2.py'\n": 1,
              "      - name: Apply frozen P1 StructureTemplate ValueOutput overlay\n": 1,
              "        run: python3 scripts/apply_p1_structure_template_value_output_26_2.py upstream-vs2\n": 1,
          }
          for needle, expected in required.items():
              actual = staged.count(needle)
              if actual != expected:
                  raise SystemExit(f'{needle!r}: expected {expected}, found {actual}')

          diff = list(difflib.unified_diff(text.splitlines(), staged.splitlines(), lineterm=''))
          added = [line[1:] for line in diff if line.startswith('+') and not line.startswith('+++')]
          removed = [line[1:] for line in diff if line.startswith('-') and not line.startswith('---')]
          semantic_added = [line for line in added if line.strip()]
          if removed:
              raise SystemExit(f'unexpected removals: {removed}')
          expected_semantic = [
              "      - 'scripts/apply_p1_structure_template_value_output_26_2.py'",
              "      - name: Apply frozen P1 StructureTemplate ValueOutput overlay",
              "        run: python3 scripts/apply_p1_structure_template_value_output_26_2.py upstream-vs2",
          ]
          if semantic_added != expected_semantic:
              raise SystemExit(f'unexpected semantic additions: {semantic_added}')

          out = Path('.ci-transport/p1-compile.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(staged, encoding='utf-8')
          print('P1_STRUCTURE_TEMPLATE_CANONICAL_STAGING_READY')
          print('\n'.join(diff))
          PY

      - name: Commit only non-workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-transport/p1-compile.yml
          test "$(git diff --cached --name-only)" = ".ci-transport/p1-compile.yml"
          git commit -m 'ci: stage StructureTemplate canonical p1 workflow blob'
          git push origin HEAD:main
