name: P1 Explosion canonical staging

on:
  push:
    paths:
      - '.github/workflows/p1-explosion-canonicalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-canonical-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build fail-closed canonical staging blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import hashlib

          source = Path('.github/workflows/p1-compile.yml')
          original = source.read_text(encoding='utf-8')

          candidate_path = "      - 'scripts/apply_p1_explosion_client_accessor_26_2.py'"
          candidate_name = "      - name: Apply traceable P1 Explosion Level client accessor overlay"
          candidate_run = "        run: python3 scripts/apply_p1_explosion_client_accessor_26_2.py upstream-vs2"

          if candidate_path in original or candidate_name in original or candidate_run in original:
              raise SystemExit('fail-closed: Explosion canonical unit is already present')

          path_anchor = (
              "      - 'scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py'\n"
              "      - '.github/workflows/p1-compile.yml'"
          )
          step_anchor = (
              "      - name: Apply frozen P1 LavaFluid randomTick ServerLevel overlay\n"
              "        run: python3 scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py upstream-vs2\n\n"
              "      - name: Show and validate port delta"
          )

          if original.count(path_anchor) != 1:
              raise SystemExit(f'fail-closed: expected one LavaFluid path anchor, found {original.count(path_anchor)}')
          if original.count(step_anchor) != 1:
              raise SystemExit(f'fail-closed: expected one LavaFluid step anchor, found {original.count(step_anchor)}')

          staged = original.replace(
              path_anchor,
              "      - 'scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py'\n"
              + candidate_path + "\n"
              "      - '.github/workflows/p1-compile.yml'",
              1,
          )
          staged = staged.replace(
              step_anchor,
              "      - name: Apply frozen P1 LavaFluid randomTick ServerLevel overlay\n"
              "        run: python3 scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py upstream-vs2\n\n"
              + candidate_name + "\n"
              + candidate_run + "\n\n"
              "      - name: Show and validate port delta",
              1,
          )

          if staged.count(candidate_path) != 1 or staged.count(candidate_name) != 1 or staged.count(candidate_run) != 1:
              raise SystemExit('fail-closed: Explosion canonical insertion count mismatch')

          diff = list(difflib.unified_diff(
              original.splitlines(), staged.splitlines(),
              fromfile='a/.github/workflows/p1-compile.yml',
              tofile='b/.github/workflows/p1-compile.yml',
              lineterm='',
          ))
          additions = [line[1:] for line in diff if line.startswith('+') and not line.startswith('+++')]
          expected = [candidate_path, candidate_name, candidate_run]
          if [line for line in additions if line] != expected:
              raise SystemExit(f'fail-closed: unexpected nonblank additions: {additions!r}')
          if len(additions) != 4 or additions.count('') != 1:
              raise SystemExit(f'fail-closed: expected exactly 4 added diff lines including one separator, got {additions!r}')
          deletions = [line for line in diff if line.startswith('-') and not line.startswith('---')]
          if deletions:
              raise SystemExit(f'fail-closed: canonical staging must not delete lines: {deletions!r}')

          out = Path('.ci-transport/p1-compile.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(staged, encoding='utf-8')
          print('\n'.join(diff))
          data = staged.encode('utf-8')
          print('P1_EXPLOSION_CANONICAL_STAGING_OK')
          print('STAGED_CANONICAL_SHA256=' + hashlib.sha256(data).hexdigest())
          print('STAGED_CANONICAL_SIZE=' + str(len(data)))
          PY

      - name: Commit staging blob only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .ci-transport/p1-compile.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = '.ci-transport/p1-compile.yml'
          git commit -m 'ci: stage Explosion canonical workflow blob'
          git push origin HEAD:main
