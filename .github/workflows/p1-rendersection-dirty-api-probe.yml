name: P1 renderer dirty authority inspection

on:
  push:
    paths:
      - '.github/workflows/p1-rendersection-dirty-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-renderer-dirty-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$', workflow, flags=re.MULTILINE)
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-renderer-dirty-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-renderer-dirty-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon | tee ../p1-renderer-dirty-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-renderer-dirty-classpath.log

      - name: Inspect exact Minecraft 26.2 renderer dirty authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-renderer-dirty-authority-probe.log
          from pathlib import Path
          import subprocess, zipfile

          cp = Path('p1-renderer-dirty-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = [Path(line.split('=',1)[1]) for line in cp.splitlines() if line.startswith('VS_CP_FILE=')]
          wanted_simple = {
              'SectionRenderDispatcher$RenderSection.class',
              'ViewArea.class',
              'LevelRenderer.class',
              'LevelExtractor.class',
              'SectionUpdateTracker.class',
          }
          found = {}
          for jar in jars:
              if not jar.exists() or jar.suffix != '.jar':
                  continue
              try:
                  with zipfile.ZipFile(jar) as zf:
                      for entry in zf.namelist():
                          simple = entry.rsplit('/',1)[-1]
                          if simple in wanted_simple and entry.startswith('net/minecraft/'):
                              found.setdefault(entry, []).append(jar)
              except zipfile.BadZipFile:
                  pass

          required_simple = {'SectionRenderDispatcher$RenderSection.class','ViewArea.class','LevelRenderer.class'}
          present_simple = {entry.rsplit('/',1)[-1] for entry in found}
          missing = required_simple - present_simple
          if missing:
              raise SystemExit('fail-closed: required renderer classes missing: ' + ', '.join(sorted(missing)))

          any_dirty = False
          for entry, hit_jars in sorted(found.items()):
              cls = entry[:-6].replace('/','.')
              for jar in hit_jars:
                  print('\n=== JAVAP', cls, 'FROM', jar, '===')
                  proc = subprocess.run(['javap','-classpath',str(jar),'-p','-s','-c',cls], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  if proc.returncode != 0:
                      raise SystemExit(f'fail-closed: javap failed for {cls}')
                  text = proc.stdout
                  print(text)
                  signals = [line.strip() for line in text.splitlines() if any(k in line.lower() for k in ('dirty','changed','rebuild','sectionupdate'))]
                  print('=== DIRTY/UPDATE SIGNALS', cls, '===')
                  for line in signals:
                      print(line)
                  if any('dirty' in line.lower() for line in signals):
                      any_dirty = True

          if not any_dirty:
              raise SystemExit('fail-closed: no dirty-related renderer authority found in exact mapped candidates')
          print('RENDERER_DIRTY_AUTHORITY_26_2_PROBE_COMPLETE')
          PY

      - name: Upload exact renderer dirty authority inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-renderer-dirty-authority-probe-${{ github.sha }}
          path: |
            p1-renderer-dirty-classpath.log
            p1-renderer-dirty-authority-probe.log
          if-no-files-found: warn
