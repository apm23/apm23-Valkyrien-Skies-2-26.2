name: P1 shipyard teleport player API proof

on:
  push:
    paths:
      - 'scripts/apply_p1_shipyard_teleport_api_26_2.py'
      - 'scripts/apply_p1_shipyard_teleport_player_api_26_2.py'
      - '.github/workflows/p1-shipyard-teleport-player-api-proof.yml'
      - '.github/workflows/p1-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shipyard-teleport-player-api-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-vs2 rev-parse HEAD)" = "f39132148e717d325933b4ce6e9e9fb13d929390"

      - name: Replay canonical frozen P1 overlays
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$', workflow, flags=re.MULTILINE)
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          teleport = [c for c in commands if 'shipyard_teleport' in c]
          if len(teleport) not in (0, 2):
              raise SystemExit(f'fail-closed: expected zero or two canonical teleport overlays, found {teleport}')
          for command in commands:
              if 'shipyard_teleport' in command:
                  continue
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Apply isolated shipyard teleport bridge
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_p1_shipyard_teleport_api_26_2.py upstream-vs2
          python3 scripts/apply_p1_shipyard_teleport_player_api_26_2.py upstream-vs2

      - name: Validate isolated teleport semantic unit
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-vs2 diff --check
          entity=upstream-vs2/common/src/main/java/org/valkyrienskies/mod/mixin/feature/shipyard_entities/MixinEntity.java
          player=upstream-vs2/common/src/main/java/org/valkyrienskies/mod/mixin/server/command/level/MixinServerPlayer.java
          listener=upstream-vs2/common/src/main/java/org/valkyrienskies/mod/mixin/server/network/MixinServerGamePacketListenerImpl.java

          test "$(grep -Fc 'Set<Relative> set, float g, float h, boolean resetCamera' "$entity")" -eq 2
          test "$(grep -Fc 'FFZ)Z' "$entity")" -eq 1
          test "$(grep -Fc 'resetCamera);' "$entity")" -eq 2
          test "$(grep -Fc 'Set<Relative> set, float g, float h, boolean resetCamera' "$player")" -eq 1
          test "$(grep -Fc 'super(level, gameProfile);' "$player")" -eq 1
          test "$(grep -Fc '((ServerPlayer) (Object) this).level();' "$player")" -eq 2
          test "$(grep -Fc 'this.getXRot(), false);' "$player")" -eq 1
          ! grep -Fq 'serverLevel()' "$player"

          test "$(grep -Fc 'PositionMoveRotation.calculateAbsolute(' "$listener")" -eq 1
          test "$(grep -Fc 'PositionMoveRotation.of(player)' "$listener")" -eq 1
          test "$(grep -Fc 'ship.getShipToWorld().transformPosition(pos);' "$listener")" -eq 1
          test "$(grep -Fc 'original.call(transformedChange, transformedRelatives);' "$listener")" -eq 1
          test "$(grep -Fc 'transformedRelatives.remove(Relative.X);' "$listener")" -eq 1
          test "$(grep -Fc 'transformedRelatives.remove(Relative.Y);' "$listener")" -eq 1
          test "$(grep -Fc 'transformedRelatives.remove(Relative.Z);' "$listener")" -eq 1

          ! grep -Fq 'RelativeMovement' "$entity"
          ! grep -Fq 'RelativeMovement' "$player"
          ! grep -Fq 'RelativeMovement' "$listener"
          ! grep -Fq 'ClientboundPlayerPositionPacket' "$listener"
          ! grep -Fq 'awaitingTeleport' "$listener"
          ! grep -Fq 'awaitingPositionFromClient' "$listener"
          ! grep -Fq 'player.absMoveTo' "$listener"

      - name: Configure exhaustive javac diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > p1-shipyard-teleport-player-api-proof.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  options.compilerArgs += ['-Xmaxerrs', '10000']
              }
          }
          GRADLE

      - name: Compile standalone sources and preserve unrelated failure
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -uo pipefail
          set +e
          ./gradlew -I ../p1-shipyard-teleport-player-api-proof.init.gradle \
            :common:compileJava :common:compileKotlin :fabric:compileJava :fabric:compileKotlin \
            --stacktrace --no-daemon 2>&1 | tee ../p1-shipyard-teleport-player-api-proof.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ../p1-shipyard-teleport-player-api-gradle-status.txt
          echo "GRADLE_EXIT_STATUS=$status"
          exit 0

      - name: Prove exact teleport files are compiler-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          log = Path('p1-shipyard-teleport-player-api-proof.log').read_text(encoding='utf-8', errors='replace')
          status = int(Path('p1-shipyard-teleport-player-api-gradle-status.txt').read_text(encoding='utf-8').strip())
          if ':common:compileJava' not in log:
              raise SystemExit('fail-closed: common Java compile task was never reached')
          if status != 0 and ('error:' not in log or 'Compilation failed' not in log):
              raise SystemExit('fail-closed: Gradle failed without normal javac frontier')
          if re.search(r'only showing the first\s+\d+\s+errors', log, flags=re.IGNORECASE):
              raise SystemExit('fail-closed: javac diagnostics were capped')

          target_paths = (
              'org/valkyrienskies/mod/mixin/feature/shipyard_entities/MixinEntity.java:',
              'org/valkyrienskies/mod/mixin/server/command/level/MixinServerPlayer.java:',
              'org/valkyrienskies/mod/mixin/server/network/MixinServerGamePacketListenerImpl.java:',
          )
          target_errors = [line for line in log.splitlines() if 'error:' in line and any(path in line for path in target_paths)]
          if target_errors:
              raise SystemExit('fail-closed: exact teleport files still have compiler diagnostics:\n' + '\n'.join(target_errors))

          unrelated = [line for line in log.splitlines() if 'error:' in line]
          print(f'SHIPYARD_TELEPORT_API_CLUSTER_COMPILER_CLEAN unrelated_error_diagnostics={len(unrelated)} gradle_status={status}')
          PY

      - name: Upload teleport proof diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-shipyard-teleport-player-api-proof-${{ github.sha }}
          path: |
            p1-shipyard-teleport-player-api-proof.log
            p1-shipyard-teleport-player-api-gradle-status.txt
          if-no-files-found: warn
