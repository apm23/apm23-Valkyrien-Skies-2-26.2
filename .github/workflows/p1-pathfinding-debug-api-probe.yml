name: P1 Pathfinding Debug API inspection
# One probe-only retry after run 35493504112 failed during transient Architectury plugin resolution before javap.

on:
  push:
    paths:
      - '.github/workflows/p1-pathfinding-debug-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-pathfinding-debug-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-pathfinding-debug-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-pathfinding-debug-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-pathfinding-debug-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-pathfinding-debug-classpath.log

      - name: Inspect exact Minecraft 26.2 pathfinding debug boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-pathfinding-debug-api-probe.log
          from pathlib import Path
          import subprocess, zipfile

          cp_log = Path('p1-pathfinding-debug-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists() and p.suffix == '.jar':
                      jars.append(p)
          if not jars:
              raise SystemExit('fail-closed: no jars on exact :common compile classpath')

          targets = {
              'net/minecraft/client/renderer/debug/DebugRenderer.class': 'net.minecraft.client.renderer.debug.DebugRenderer',
              'net/minecraft/client/renderer/debug/PathfindingRenderer.class': 'net.minecraft.client.renderer.debug.PathfindingRenderer',
          }
          found = {k: [] for k in targets}
          candidate_entries = set()
          patterns = ('MultiBufferSource', 'BufferSource', 'SubmitNode', 'Gizmo', 'DebugData', 'DebugValue', 'Frustum')

          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      names = set(zf.namelist())
                      for entry in targets:
                          if entry in names:
                              found[entry].append(jar)
                      if any(entry in names for entry in targets):
                          print('=== TARGET JAR', jar, '===')
                          for name in sorted(names):
                              if name.endswith('.class') and name.startswith(('net/minecraft/client/renderer/', 'net/minecraft/client/renderer/debug/', 'net/minecraft/client/renderer/gizmos/', 'net/minecraft/client/')) and any(p in name for p in patterns):
                                  candidate_entries.add(name)
              except zipfile.BadZipFile:
                  pass

          missing = [entry for entry, hits in found.items() if not hits]
          if missing:
              raise SystemExit('fail-closed: exact mapped debug classes missing: ' + ', '.join(missing))

          print('=== CANDIDATE RENDER/DEBUG CLASSES ===')
          for name in sorted(candidate_entries):
              print(name)

          outputs = {}
          for entry, cls in targets.items():
              texts = []
              for jar in found[entry]:
                  print('\n=== JAVAP', cls, 'FROM', jar, '===')
                  proc = subprocess.run(['javap', '-classpath', str(jar), '-p', '-s', '-c', cls], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
                  print(proc.stdout)
                  if proc.returncode != 0:
                      raise SystemExit(f'fail-closed: javap failed for {cls}')
                  texts.append(proc.stdout)
              outputs[cls] = '\n'.join(texts)

          debug = outputs['net.minecraft.client.renderer.debug.DebugRenderer']
          path = outputs['net.minecraft.client.renderer.debug.PathfindingRenderer']
          print('\n=== METHOD MARKERS ===')
          for label, text in [('DebugRenderer', debug), ('PathfindingRenderer', path)]:
              print(label, 'render=', ' render(' in text, 'emitGizmos=', ' emitGizmos(' in text, 'MultiBufferSource=', 'MultiBufferSource' in text, 'PoseStack=', 'PoseStack' in text, 'DebugValueAccess=', 'DebugValueAccess' in text)

          if 'pathfindingRenderer' not in debug:
              raise SystemExit('fail-closed: DebugRenderer.pathfindingRenderer field not proven')
          if not any(marker in debug for marker in (' render(', ' emitGizmos(')):
              raise SystemExit('fail-closed: no current DebugRenderer render/emitGizmos boundary proven')
          if not any(marker in path for marker in (' render(', ' emitGizmos(')):
              raise SystemExit('fail-closed: no current PathfindingRenderer render/emitGizmos boundary proven')

          print('PATHFINDING_DEBUG_26_2_API_INSPECTED exact_debug_owner=true exact_pathfinding_owner=true')
          PY

      - name: Upload exact pathfinding debug API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-pathfinding-debug-api-probe-${{ github.sha }}
          path: |
            p1-pathfinding-debug-classpath.log
            p1-pathfinding-debug-api-probe.log
          if-no-files-found: warn
