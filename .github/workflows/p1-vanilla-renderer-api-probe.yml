name: P1 vanilla renderer API inspection
# Inspection-only proof for the exact Minecraft 26.2 renderer surface used by upstream MixinLevelRendererVanilla.
# This workflow never mutates upstream VS2 source.

on:
  push:
    paths:
      - '.github/workflows/p1-vanilla-renderer-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-vanilla-renderer-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Verify pinned upstream target identity
        shell: bash
        run: |
          set -euo pipefail
          target='common/src/main/java/org/valkyrienskies/mod/mixin/mod_compat/vanilla_renderer/MixinLevelRendererVanilla.java'
          actual="$(git -C upstream-vs2 hash-object "$target")"
          test "$actual" = '824e1ac56a99bc6480cc80c32c085d18c2425b09'
          echo "VANILLA_RENDERER_UPSTREAM_BLOB=$actual"

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-vanilla-renderer-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-vanilla-renderer-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-vanilla-renderer-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-vanilla-renderer-classpath.log

      - name: Inspect exact renderer classes and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-vanilla-renderer-api-probe.log
          from pathlib import Path
          import subprocess, zipfile

          cp_log = Path('p1-vanilla-renderer-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists() and p.suffix == '.jar':
                      jars.append(p)

          owners = []
          inventories = {}
          tokens = ('Uniform', 'VertexBuffer', 'LightTexture', 'RenderType', 'Shader', 'GpuBuffer', 'RenderPass', 'RenderPipeline', 'SectionRender', 'LevelRenderer', 'LevelExtractor', 'ViewArea')
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      names = zf.namelist()
                      if 'net/minecraft/client/renderer/LevelRenderer.class' in names:
                          owners.append(jar)
                      matches = [n for n in names if n.endswith('.class') and any(t.lower() in n.lower() for t in tokens)]
                      if matches:
                          inventories[jar] = matches
              except zipfile.BadZipFile:
                  pass

          if len(owners) != 1:
              raise SystemExit(f'fail-closed: expected one mapped MC owner jar, got {len(owners)}')
          owner = owners[0]
          print('MC_OWNER', owner)
          print('RENDER_CLASS_INVENTORY_BEGIN')
          with zipfile.ZipFile(owner) as zf:
              owner_names = zf.namelist()
          candidates = sorted(n for n in owner_names if n.endswith('.class') and any(t.lower() in n.lower() for t in tokens))
          for n in candidates:
              print(n)
          print('RENDER_CLASS_INVENTORY_END')

          obsolete = [
              'com/mojang/blaze3d/shaders/Uniform.class',
              'com/mojang/blaze3d/vertex/VertexBuffer.class',
              'net/minecraft/client/renderer/LightTexture.class',
              'net/minecraft/client/renderer/RenderType.class',
              'net/minecraft/client/renderer/ShaderInstance.class',
          ]
          for entry in obsolete:
              print('OBSOLETE_ENTRY', entry, 'present=' + str(entry in owner_names).lower())

          fixed = [
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.LevelExtractor',
              'net.minecraft.client.renderer.GameRenderer',
              'net.minecraft.client.renderer.ViewArea',
              'net.minecraft.client.renderer.chunk.SectionRenderDispatcher',
              'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection',
              'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$CompiledSection',
              'com.mojang.blaze3d.systems.RenderSystem',
              'com.mojang.blaze3d.vertex.PoseStack',
          ]

          dynamic = []
          for entry in candidates:
              dotted = entry[:-6].replace('/', '.')
              simple = dotted.rsplit('.', 1)[-1]
              if any(key in simple for key in ('RenderType', 'Shader', 'VertexBuffer', 'GpuBuffer', 'RenderPass', 'RenderPipeline', 'LightTexture', 'Uniform')):
                  dynamic.append(dotted)

          classes = []
          for cls in fixed + dynamic:
              if cls not in classes:
                  classes.append(cls)

          outputs = {}
          for cls in classes[:80]:
              proc = subprocess.run(
                  ['javap', '-classpath', str(owner), '-p', '-s', '-c', cls],
                  text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT,
              )
              if proc.returncode != 0:
                  print('\n=== JAVAP_MISSING', cls, '===')
                  print(proc.stdout)
                  continue
              outputs[cls] = proc.stdout
              print('\n=== JAVAP', cls, '===')
              print(proc.stdout)

          level = outputs.get('net.minecraft.client.renderer.LevelRenderer', '')
          extractor = outputs.get('net.minecraft.client.renderer.LevelExtractor', '')
          section = outputs.get('net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection', '')
          if not level:
              raise SystemExit('fail-closed: LevelRenderer javap missing')
          print('LEVELRENDERER_HAS_RENDERLEVEL', str(' renderLevel(' in level).lower())
          print('LEVELRENDERER_HAS_RENDER', str(' render(' in level).lower())
          print('LEVELRENDERER_HAS_SETUPRENDER', str(' setupRender(' in level).lower())
          print('LEVELRENDERER_HAS_COMPILESECTIONS', str(' compileSections(' in level).lower())
          print('LEVELRENDERER_HAS_VISIBLESECTIONS', str('visibleSections' in level).lower())
          print('LEVELRENDERER_HAS_RENDERSECTIONLAYER', str(' renderSectionLayer(' in level).lower())
          print('LEVELEXTRACTOR_PRESENT', str(bool(extractor)).lower())
          print('RENDERSECTION_PRESENT', str(bool(section)).lower())

          refs = ('RenderType', 'Shader', 'GpuBuffer', 'RenderPass', 'RenderPipeline', 'SectionRender', 'PoseStack', 'Matrix4', 'CameraRenderState')
          print('LEVELRENDERER_RENDER_REFS_BEGIN')
          for line in level.splitlines():
              if any(r in line for r in refs):
                  print(line)
          print('LEVELRENDERER_RENDER_REFS_END')
          print('VANILLA_RENDERER_26_2_API_INSPECTED owner=true upstream_blob=true')
          PY

      - name: Upload exact vanilla renderer API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-vanilla-renderer-api-probe-${{ github.sha }}
          path: |
            p1-vanilla-renderer-classpath.log
            p1-vanilla-renderer-api-probe.log
          if-no-files-found: warn
