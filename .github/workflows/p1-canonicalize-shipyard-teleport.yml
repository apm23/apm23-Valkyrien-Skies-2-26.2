name: P1 canonicalize frozen proof overlays
# One-shot recovery harness; generated canonical commit deletes this workflow.

on:
  push:
    paths:
      - '.github/workflows/p1-canonicalize-shipyard-teleport.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonicalize frozen proof overlays fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'fail-closed: {label} expected once, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          compile_path = Path('.github/workflows/p1-compile.yml')
          proof_path = Path('.github/workflows/p1-shipyard-teleport-player-api-proof.yml')
          self_path = Path('.github/workflows/p1-canonicalize-shipyard-teleport.yml')
          frozen = (
              'apply_p1_entityhandler_renderstate_26_2.py',
              'apply_p1_sable_companion_compileonly_26_2.py',
              'apply_p1_deployer_scroll_option_exclusion_26_2.py',
              'apply_p1_entity_authority_interpolation_26_2.py',
              'apply_p1_entity_renderer_submit_26_2.py',
              'apply_p1_distance_manager_ticket_storage_26_2.py',
          )

          compile_text = compile_path.read_text(encoding='utf-8')
          present = [name for name in frozen if name in compile_text]
          if present:
              raise SystemExit(f'fail-closed: frozen proof overlays already canonicalized: {present}')
          if compile_text.count('python3 scripts/apply_p1_shipyard_teleport_api_26_2.py upstream-vs2') != 1:
              raise SystemExit('fail-closed: canonical teleport anchor missing')
          if compile_text.count('python3 scripts/apply_p1_shipyard_teleport_player_api_26_2.py upstream-vs2') != 1:
              raise SystemExit('fail-closed: canonical ServerPlayer teleport anchor missing')

          old_paths = "      - 'scripts/apply_p1_relocationutil_blockentity_value_input_26_2.py'\n      - 'scripts/apply_p1_shipyard_teleport_api_26_2.py'\n      - 'scripts/apply_p1_shipyard_teleport_player_api_26_2.py'\n"
          new_paths = "      - 'scripts/apply_p1_relocationutil_blockentity_value_input_26_2.py'\n      - 'scripts/apply_p1_entityhandler_renderstate_26_2.py'\n      - 'scripts/apply_p1_sable_companion_compileonly_26_2.py'\n      - 'scripts/apply_p1_deployer_scroll_option_exclusion_26_2.py'\n      - 'scripts/apply_p1_entity_authority_interpolation_26_2.py'\n      - 'scripts/apply_p1_entity_renderer_submit_26_2.py'\n      - 'scripts/apply_p1_distance_manager_ticket_storage_26_2.py'\n      - 'scripts/apply_p1_shipyard_teleport_api_26_2.py'\n      - 'scripts/apply_p1_shipyard_teleport_player_api_26_2.py'\n"
          replace_once(compile_path, old_paths, new_paths, 'canonical frozen-overlay push paths')

          old_steps = "      - name: Apply traceable P1 RelocationUtil block-entity ValueInput overlay\n        run: python3 scripts/apply_p1_relocationutil_blockentity_value_input_26_2.py upstream-vs2\n\n      - name: Apply traceable P1 shipyard teleport API overlay\n"
          new_steps = "      - name: Apply traceable P1 RelocationUtil block-entity ValueInput overlay\n        run: python3 scripts/apply_p1_relocationutil_blockentity_value_input_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 entity-handler render-state overlay\n        run: python3 scripts/apply_p1_entityhandler_renderstate_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 Sable compile-boundary overlay\n        run: python3 scripts/apply_p1_sable_companion_compileonly_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 optional Create deployer exclusion overlay\n        run: python3 scripts/apply_p1_deployer_scroll_option_exclusion_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 entity authority/interpolation overlay\n        run: python3 scripts/apply_p1_entity_authority_interpolation_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 entity renderer submit overlay\n        run: python3 scripts/apply_p1_entity_renderer_submit_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 DistanceManager TicketStorage overlay\n        run: python3 scripts/apply_p1_distance_manager_ticket_storage_26_2.py upstream-vs2\n\n      - name: Apply traceable P1 shipyard teleport API overlay\n"
          replace_once(compile_path, old_steps, new_steps, 'canonical frozen-overlay steps')

          old_reapply = "      - name: Reapply frozen proof overlays\n        shell: bash\n        run: |\n          set -euo pipefail\n          python3 scripts/apply_p1_entityhandler_renderstate_26_2.py upstream-vs2\n          python3 scripts/apply_p1_sable_companion_compileonly_26_2.py upstream-vs2\n          python3 scripts/apply_p1_deployer_scroll_option_exclusion_26_2.py upstream-vs2\n          python3 scripts/apply_p1_entity_authority_interpolation_26_2.py upstream-vs2\n          python3 scripts/apply_p1_entity_renderer_submit_26_2.py upstream-vs2\n          python3 scripts/apply_p1_distance_manager_ticket_storage_26_2.py upstream-vs2\n\n"
          replace_once(proof_path, old_reapply, '', 'teleport proof duplicate frozen-overlay replay')

          final_compile = compile_path.read_text(encoding='utf-8')
          for name in frozen:
              command = f'python3 scripts/{name} upstream-vs2'
              if final_compile.count(command) != 1:
                  raise SystemExit(f'fail-closed: canonical count mismatch for {command}')
          if 'Reapply frozen proof overlays' in proof_path.read_text(encoding='utf-8'):
              raise SystemExit('fail-closed: duplicate frozen-overlay proof step still present')
          if not self_path.is_file():
              raise SystemExit('fail-closed: temporary canonicalizer missing')
          self_path.unlink()
          PY

          git diff --check
          git diff -- .github/workflows/p1-compile.yml .github/workflows/p1-shipyard-teleport-player-api-proof.yml .github/workflows/p1-canonicalize-shipyard-teleport.yml

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'apm23'
          git config user.email '80390905+apm23@users.noreply.github.com'
          git add .github/workflows/p1-compile.yml .github/workflows/p1-shipyard-teleport-player-api-proof.yml
          git add -u .github/workflows/p1-canonicalize-shipyard-teleport.yml
          git commit -m 'ci: canonicalize frozen P1 proof overlays'
          git push origin HEAD:main
