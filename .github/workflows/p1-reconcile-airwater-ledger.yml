name: P1 transport validated AirAndWaterRandomPos ledger

on:
  push:
    paths:
      - '.github/workflows/p1-reconcile-airwater-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  transport-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch exact validated ledger artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ledger
          gh run download 35473264763 \
            --repo "$GITHUB_REPOSITORY" \
            --name p1-airwater-ledger-bc478e0dd473a38d05f7c0c00bd526f8526b33c2 \
            --dir /tmp/ledger
          test -f /tmp/ledger/reconciled-MASTER_STATE.md
          echo '333a32f75773fe76cb0d761643cc44a6c3971766d3b1e0b9f52a173bd5ae3fbd  /tmp/ledger/reconciled-MASTER_STATE.md' | sha256sum -c -
          cp /tmp/ledger/reconciled-MASTER_STATE.md MASTER_STATE.md
          git diff --check -- MASTER_STATE.md
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'MASTER_STATE.md'

      - name: Commit ledger only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_STATE.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'MASTER_STATE.md'
          git commit -m 'docs: freeze AirAndWaterRandomPos boundary and classify next frontier'
          git push origin HEAD:main
