name: P1 reconcile AirAndWaterRandomPos ledger

on:
  push:
    paths:
      - '.github/workflows/p1-reconcile-airwater-ledger.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Produce reconciled MASTER_STATE
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          def dec(value):
              return zlib.decompress(base64.b64decode(value)).decode('utf-8')

          def replace_between(text, start, end, replacement):
              if text.count(start) != 1 or text.count(end) != 1:
                  raise SystemExit(f'fail-closed marker mismatch: {start!r}={text.count(start)} {end!r}={text.count(end)}')
              before, rest = text.split(start, 1)
              _, after = rest.split(end, 1)
              return before + replacement + end + after

          current = dec('')
          frontier = dec('')
          old_state = dec('')
          new_state = dec('')
          next_action = dec('')

          path = Path('MASTER_STATE.md')
          text = path.read_text(encoding='utf-8')
          text = replace_between(text, '## Current reconciliation —', '### POIManager ChunkPos construction boundary — frozen\n', current)
          text = replace_between(text, '## Remaining Java compile frontier\n', '## Target runtime baseline\n', frontier)
          if text.count(old_state) != 1:
              raise SystemExit(f'fail-closed project-state anchor count {text.count(old_state)}')
          text = text.replace(old_state, new_state, 1)
          text = replace_between(text, '## next_safe_action\n', '## Video and milestone gate\n', next_action)
          for token in ('960582c42b407e9c4dbc1943f1d2cc3d8c3dbfe6', '35472793999', '35472794011', '10593271100', 'feature/tick_ship_chunks/MixinChunkMap.java', 'six pinned `.x/.z` coordinate reads'):
              if token not in text:
                  raise SystemExit(f'fail-closed missing reconciled ledger token: {token}')
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check -- MASTER_STATE.md
          git diff -- MASTER_STATE.md
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'MASTER_STATE.md'
          cp MASTER_STATE.md reconciled-MASTER_STATE.md

      - name: Upload reconciled ledger
        uses: actions/upload-artifact@v4
        with:
          name: p1-airwater-ledger-${{ github.sha }}
          path: reconciled-MASTER_STATE.md
          if-no-files-found: error
