name: P1 LevelRenderer API inspection
# Inspection-only proof for the exact Minecraft 26.2 renderLevel callback surface.
# This workflow never mutates upstream VS2 source.

on:
  push:
    paths:
      - '.github/workflows/p1-levelrenderer-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-levelrenderer-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-levelrenderer-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-levelrenderer-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-levelrenderer-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-levelrenderer-classpath.log

      - name: Inspect exact Minecraft 26.2 LevelRenderer callback surface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-levelrenderer-api-probe.log
          from pathlib import Path
          import re, subprocess, zipfile

          cp_log = Path('p1-levelrenderer-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists() and p.suffix == '.jar':
                      jars.append(p)
          if not jars:
              raise SystemExit('fail-closed: no jars on exact :common compile classpath')

          target_entry = 'net/minecraft/client/renderer/LevelRenderer.class'
          owners = []
          old_light_hits = []
          light_entries = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      names = zf.namelist()
                      name_set = set(names)
                      if target_entry in name_set:
                          owners.append(jar)
                      if 'net/minecraft/client/renderer/LightTexture.class' in name_set:
                          old_light_hits.append(jar)
                      for name in names:
                          if name.startswith('net/minecraft/client/renderer/') and name.endswith('.class') and 'Light' in name:
                              light_entries.append((jar.name, name))
              except zipfile.BadZipFile:
                  pass

          if len(owners) != 1:
              raise SystemExit(f'fail-closed: expected one LevelRenderer owner jar, got {len(owners)}')
          owner = owners[0]
          print('LEVELRENDERER_OWNER', owner)
          print('OLD_LIGHTTEXTURE_PRESENT', bool(old_light_hits))
          print('CURRENT_RENDERER_LIGHT_CLASSES')
          for jar_name, entry in sorted(set(light_entries)):
              print(jar_name, entry)

          classes = [
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.GameRenderer',
              'net.minecraft.client.renderer.SectionOcclusionGraph',
          ]
          outputs = {}
          for cls in classes:
              proc = subprocess.run(['javap', '-classpath', str(owner), '-p', '-s', '-c', cls], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print('\n=== JAVAP', cls, '===')
              print(proc.stdout)
              if proc.returncode != 0:
                  raise SystemExit(f'fail-closed: javap failed for {cls}')
              outputs[cls] = proc.stdout

          level = outputs['net.minecraft.client.renderer.LevelRenderer']
          sigs = [line.strip() for line in level.splitlines() if ' renderLevel(' in line]
          if not sigs:
              raise SystemExit('fail-closed: LevelRenderer.renderLevel missing')
          print('RENDERLEVEL_SIGNATURE_COUNT', len(sigs))
          for sig in sigs:
              print('RENDERLEVEL_SIGNATURE', sig)

          descriptors = []
          lines = level.splitlines()
          for i, line in enumerate(lines):
              if ' renderLevel(' in line:
                  for j in range(i + 1, min(i + 5, len(lines))):
                      if 'descriptor:' in lines[j]:
                          descriptors.append(lines[j].strip())
                          break
          for desc in descriptors:
              print('RENDERLEVEL_DESCRIPTOR', desc)

          old_sig_tokens = [
              'net.minecraft.client.DeltaTracker',
              'boolean',
              'net.minecraft.client.Camera',
              'net.minecraft.client.renderer.GameRenderer',
          ]
          if not all(token in sigs[0] for token in old_sig_tokens):
              raise SystemExit('fail-closed: leading renderLevel callback semantics changed unexpectedly')
          if 'net.minecraft.client.renderer.LightTexture' in sigs[0]:
              raise SystemExit('fail-closed: old LightTexture unexpectedly still present in renderLevel')
          if 'org.joml.Matrix4f' not in sigs[0]:
              raise SystemExit('fail-closed: Matrix4f renderLevel boundary not found')
          if 'private net.minecraft.client.renderer.SectionOcclusionGraph sectionOcclusionGraph;' not in level:
              raise SystemExit('fail-closed: SectionOcclusionGraph field contract changed')
          if 'public void invalidate();' not in outputs['net.minecraft.client.renderer.SectionOcclusionGraph']:
              raise SystemExit('fail-closed: SectionOcclusionGraph.invalidate missing')

          # Preserve evidence for the block-damage constant hook rather than guessing it still exists.
          render_idx = level.find(sigs[0])
          render_body = level[render_idx:] if render_idx >= 0 else level
          has_1024 = ('double 1024.0d' in render_body or 'double 1024' in render_body)
          print('RENDERLEVEL_1024_CONSTANT_PRESENT', has_1024)
          print('LEVELRENDERER_26_2_API_INSPECTED old_lighttexture_absent=' + str(not old_light_hits).lower() + ' section_graph_invalidate=true')
          PY

      - name: Upload exact LevelRenderer API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-levelrenderer-api-probe-${{ github.sha }}
          path: |
            p1-levelrenderer-classpath.log
            p1-levelrenderer-api-probe.log
          if-no-files-found: warn
