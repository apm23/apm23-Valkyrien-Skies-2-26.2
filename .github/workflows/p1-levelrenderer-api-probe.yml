name: P1 LevelRenderer API inspection
# Inspection-only proof for the exact Minecraft 26.2 LevelRenderer/GameRenderer split.
# This workflow never mutates upstream VS2 source.

on:
  push:
    paths:
      - '.github/workflows/p1-levelrenderer-api-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-levelrenderer-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-levelrenderer-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-levelrenderer-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-levelrenderer-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-levelrenderer-classpath.log

      - name: Prove exact Minecraft 26.2 render split and block-breaking path
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-levelrenderer-api-probe.log
          from pathlib import Path
          import re, subprocess, zipfile

          cp_log = Path('p1-levelrenderer-classpath.log').read_text(encoding='utf-8', errors='replace')
          cp_files = []
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists():
                      cp_files.append(p)
                      if p.suffix == '.jar': jars.append(p)
          if not jars:
              raise SystemExit('fail-closed: no jars on exact :common compile classpath')

          target_entry = 'net/minecraft/client/renderer/LevelRenderer.class'
          owners = []
          old_light_hits = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      names = set(zf.namelist())
                      if target_entry in names: owners.append(jar)
                      if 'net/minecraft/client/renderer/LightTexture.class' in names: old_light_hits.append(jar)
              except zipfile.BadZipFile:
                  pass
          if len(owners) != 1:
              raise SystemExit(f'fail-closed: expected one LevelRenderer owner jar, got {len(owners)}')
          owner = owners[0]
          print('LEVELRENDERER_OWNER', owner)
          print('OLD_LIGHTTEXTURE_PRESENT', bool(old_light_hits))

          classes = [
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.GameRenderer',
              'net.minecraft.client.renderer.SectionOcclusionGraph',
              'net.minecraft.client.renderer.extract.LevelExtractor',
              'net.minecraft.client.renderer.state.level.LevelRenderState',
          ]
          outputs = {}
          for cls in classes:
              proc = subprocess.run(['javap', '-classpath', str(owner), '-p', '-s', '-c', cls], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print('\n=== JAVAP', cls, '===')
              print(proc.stdout)
              if proc.returncode != 0:
                  raise SystemExit(f'fail-closed: javap failed for {cls}')
              outputs[cls] = proc.stdout

          level = outputs['net.minecraft.client.renderer.LevelRenderer']
          game = outputs['net.minecraft.client.renderer.GameRenderer']
          graph = outputs['net.minecraft.client.renderer.SectionOcclusionGraph']
          extractor = outputs['net.minecraft.client.renderer.extract.LevelExtractor']
          state = outputs['net.minecraft.client.renderer.state.level.LevelRenderState']

          if ' renderLevel(' in level:
              raise SystemExit('fail-closed: LevelRenderer.renderLevel unexpectedly still exists')
          if 'public void renderLevel(net.minecraft.client.DeltaTracker);' not in game:
              raise SystemExit('fail-closed: GameRenderer.renderLevel(DeltaTracker) not found')
          expected_render = 'public void render(com.mojang.blaze3d.resource.GraphicsResourceAllocator, net.minecraft.client.DeltaTracker, boolean, net.minecraft.client.renderer.state.level.CameraRenderState, org.joml.Matrix4fc, com.mojang.blaze3d.buffers.GpuBufferSlice, org.joml.Vector4f, boolean);'
          if expected_render not in level:
              raise SystemExit('fail-closed: exact LevelRenderer.render(...) signature changed')
          if 'private final net.minecraft.client.renderer.GameRenderer gameRenderer;' not in level:
              raise SystemExit('fail-closed: LevelRenderer.gameRenderer ownership changed')
          if 'private final net.minecraft.client.renderer.SectionOcclusionGraph sectionOcclusionGraph;' not in level:
              raise SystemExit('fail-closed: SectionOcclusionGraph field ownership changed')
          if 'public net.minecraft.client.Camera mainCamera();' not in game:
              raise SystemExit('fail-closed: GameRenderer.mainCamera() missing')
          if 'public void invalidate();' not in graph:
              raise SystemExit('fail-closed: SectionOcclusionGraph.invalidate() missing')
          if old_light_hits:
              raise SystemExit('fail-closed: obsolete LightTexture unexpectedly present')

          block_method = re.search(
              r'private void submitBlockDestroyAnimation\(.*?(?=\n  (?:public|private|protected) |\Z)',
              level,
              flags=re.S,
          )
          if not block_method:
              raise SystemExit('fail-closed: submitBlockDestroyAnimation method not found')
          block_body = block_method.group(0)
          if 'LevelRenderState.blockBreakingRenderStates' not in block_body:
              raise SystemExit('fail-closed: LevelRenderer block-breaking state consumption missing')
          renderer_has_1024 = ('1024.0d' in block_body or '1024.0' in block_body)
          extractor_has_1024 = ('1024.0d' in extractor or '1024.0' in extractor)
          print('BLOCK_BREAKING_RENDERER_1024', renderer_has_1024)
          print('BLOCK_BREAKING_EXTRACTOR_1024', extractor_has_1024)
          print('LEVEL_EXTRACTOR_BLOCK_BREAKING_REFS', extractor.count('blockBreakingRenderStates'))
          for line in extractor.splitlines():
              if any(token in line for token in ('blockBreakingRenderStates', 'BlockBreakingRenderState', '1024.0', 'distSqr', 'distanceToSqr')):
                  print('LEVEL_EXTRACTOR_EVIDENCE', line.strip())
          if 'blockBreakingRenderStates' not in state:
              raise SystemExit('fail-closed: LevelRenderState block-breaking state list missing')

          print('LEVELRENDERER_26_2_SPLIT_PROVEN old_renderlevel_owner_absent=true current_render_owner=true game_main_camera=true section_graph_invalidate=true old_lighttexture_absent=true')
          PY

      - name: Compile scratch LevelRenderer mixin shape against exact classpath
        shell: bash
        run: |
          set -euo pipefail
          CP="$(grep '^VS_CP_FILE=' p1-levelrenderer-classpath.log | cut -d= -f2- | paste -sd: -)"
          mkdir -p p1-levelrenderer-scratch/probe
          cat > p1-levelrenderer-scratch/probe/LevelRendererMixinScratch.java <<'JAVA'
          package probe;

          import com.mojang.blaze3d.buffers.GpuBufferSlice;
          import com.mojang.blaze3d.resource.GraphicsResourceAllocator;
          import net.minecraft.client.Camera;
          import net.minecraft.client.DeltaTracker;
          import net.minecraft.client.renderer.GameRenderer;
          import net.minecraft.client.renderer.LevelRenderer;
          import net.minecraft.client.renderer.SectionOcclusionGraph;
          import net.minecraft.client.renderer.state.level.CameraRenderState;
          import org.joml.Matrix4fc;
          import org.joml.Vector4f;
          import org.spongepowered.asm.mixin.Final;
          import org.spongepowered.asm.mixin.Mixin;
          import org.spongepowered.asm.mixin.Shadow;
          import org.spongepowered.asm.mixin.injection.At;
          import org.spongepowered.asm.mixin.injection.Inject;
          import org.spongepowered.asm.mixin.injection.callback.CallbackInfo;

          @Mixin(LevelRenderer.class)
          abstract class LevelRendererMixinScratch {
              @Shadow @Final private GameRenderer gameRenderer;
              @Shadow @Final private SectionOcclusionGraph sectionOcclusionGraph;

              @Inject(method = "render", at = @At("HEAD"))
              private void vs$probeCurrentRenderBoundary(
                  GraphicsResourceAllocator allocator,
                  DeltaTracker deltaTracker,
                  boolean renderBlockOutline,
                  CameraRenderState cameraRenderState,
                  Matrix4fc matrix,
                  GpuBufferSlice bufferSlice,
                  Vector4f vector,
                  boolean flag,
                  CallbackInfo ci
              ) {
                  Camera camera = this.gameRenderer.mainCamera();
                  if (camera != null) this.sectionOcclusionGraph.invalidate();
              }
          }
          JAVA
          javac -proc:none -cp "$CP" -d p1-levelrenderer-scratch/out p1-levelrenderer-scratch/probe/LevelRendererMixinScratch.java
          echo 'LEVELRENDERER_26_2_SCRATCH_MIXIN_COMPILES' | tee p1-levelrenderer-scratch-compile.log

      - name: Upload exact LevelRenderer API inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-levelrenderer-api-probe-${{ github.sha }}
          path: |
            p1-levelrenderer-classpath.log
            p1-levelrenderer-api-probe.log
            p1-levelrenderer-scratch-compile.log
          if-no-files-found: warn
