name: P1 reconcile tick ship chunks ledger

on:
  push:
    paths:
      - '.github/workflows/p1-reconcile-tick-ship-chunks-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Reconcile MASTER_STATE fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64

          p = Path('MASTER_STATE.md')
          text = p.read_text(encoding='utf-8')
          new_top = base64.b64decode('').decode('utf-8')
          new_frontier = base64.b64decode('').decode('utf-8')
          new_next = base64.b64decode('').decode('utf-8')

          top_start = text.index('## Current reconciliation —')
          top_end = text.index('### AirAndWaterRandomPos max-build boundary — frozen', top_start)
          text = text[:top_start] + new_top + text[top_end:]

          frontier_start = text.index('## Remaining Java compile frontier\n')
          frontier_end = text.index('## Target runtime baseline\n', frontier_start)
          text = text[:frontier_start] + new_frontier + text[frontier_end:]

          replacements = {
              '- active_proof_head: `960582c42b407e9c4dbc1943f1d2cc3d8c3dbfe6; canonical P1 chain through AirAndWaterRandomPos max-build boundary`': '- active_proof_head: `20789867ea96d411cfc9e20402e074b235ea5877; canonical P1 chain through tick-ship-chunks ChunkPos accessor boundary`',
              '- active_proof_run: `P0 35472794096 success; AirAndWaterRandomPos exact proof 35472793999 success; canonical compile 35472794011 frontier-only failure; artifact 10593271100; 300 diagnostics / 37 normalized source files; target absent`': '- active_proof_run: `P0 35474675327 success; tick-ship-chunks exact proof 35474675349 success; canonical compile 35474675403 frontier-only failure; artifact 10593542676; 300 diagnostics / 37 normalized source files; target absent`',
              '- active_hypothesis: `next smallest evidence-backed unit is feature/tick_ship_chunks/MixinChunkMap ChunkPos x/z access; reuse frozen NaturalSpawner .x/.z -> .x()/.z() mapping only after this ledger HEAD passes P0`': '- active_hypothesis: `next smallest direct-precedent unit is feature/ship_debug_overlay/MixinDebugScreenOverlay BlockPos.getCenter(); prove only Vec3.atCenterOf(blockPos) using frozen CompatUtil center mapping precedent after this ledger HEAD passes P0`',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'fail-closed: project-state line mismatch: {old}')
              text = text.replace(old, new, 1)

          next_start = text.index('## next_safe_action\n')
          next_end = text.index('## Video and milestone gate\n', next_start)
          text = text[:next_start] + new_next + text[next_end:]
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'MASTER_STATE.md'
          grep -Fq 'canonical implementation HEAD: `20789867ea96d411cfc9e20402e074b235ea5877`' MASTER_STATE.md
          grep -Fq 'exact canonical tick-ship-chunks proof `35474675349`: success.' MASTER_STATE.md
          grep -Fq 'artifact `10593542676`' MASTER_STATE.md
          grep -Fq 'Vec3.atCenterOf(blockPos)' MASTER_STATE.md

      - name: Commit ledger only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_STATE.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = 'MASTER_STATE.md'
          git diff --cached --check
          git commit -m 'docs: freeze tick ship chunks boundary and classify next frontier'
          git push origin HEAD:main
