name: P1 LavaFluid randomTick ServerLevel proof

on:
  push:
    paths:
      - 'scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py'
      - '.github/workflows/p1-lavafluid-randomtick-serverlevel-proof.yml'
      - '.github/workflows/p1-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lavafluid-randomtick-serverlevel-proof:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify pinned upstream
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream-vs2 rev-parse HEAD)" = "f39132148e717d325933b4ce6e9e9fb13d929390"

      - name: Replay canonical frozen P1 overlays excluding LavaFluid ServerLevel unit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shlex
          import subprocess

          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 80:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} parseable commands')
          candidate = [c for c in commands if 'apply_p1_lavafluid_randomtick_serverlevel_26_2.py' in c]
          if len(candidate) > 1:
              raise SystemExit(f'fail-closed: duplicate canonical LavaFluid ServerLevel overlays: {candidate}')
          for command in commands:
              if 'apply_p1_lavafluid_randomtick_serverlevel_26_2.py' in command:
                  continue
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Apply isolated LavaFluid ServerLevel overlay
        run: python3 scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py upstream-vs2

      - name: Validate isolated LavaFluid semantic unit
        shell: bash
        run: |
          set -euo pipefail
          target=upstream-vs2/common/src/main/java/org/valkyrienskies/mod/mixin/feature/fire_between_ship_and_world/LavaFluidMixin.java
          git -C upstream-vs2 diff --check
          git -C upstream-vs2 diff -- common/src/main/java/org/valkyrienskies/mod/mixin/feature/fire_between_ship_and_world/LavaFluidMixin.java
          test "$(grep -Fc 'import net.minecraft.server.level.ServerLevel;' "$target")" -eq 1
          ! grep -Fq 'import net.minecraft.world.level.Level;' "$target"
          test "$(grep -Fc 'public void fireTickMixin(final ServerLevel level, final BlockPos pos, final FluidState state, final RandomSource random,' "$target")" -eq 1
          ! grep -Fq 'public void fireTickMixin(final Level level,' "$target"
          ! grep -Fq '(ServerLevel)' "$target"
          test "$(grep -Fc '@Inject(method = "randomTick", at = @At("TAIL"))' "$target")" -eq 1
          test "$(grep -Fc 'VSGameUtilsKt.transformToNearbyShipsAndWorld(level, origX, origY, origZ, 3, (x, y, z) -> {' "$target")" -eq 1
          test "$(grep -Fc 'randomTick(level, BlockPos.containing(x, y, z), state, random);' "$target")" -eq 1
          test "$(git -C upstream-vs2 diff --numstat -- common/src/main/java/org/valkyrienskies/mod/mixin/feature/fire_between_ship_and_world/LavaFluidMixin.java | awk '{print $1}')" -eq 2
          test "$(git -C upstream-vs2 diff --numstat -- common/src/main/java/org/valkyrienskies/mod/mixin/feature/fire_between_ship_and_world/LavaFluidMixin.java | awk '{print $2}')" -eq 2

      - name: Configure exhaustive javac diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > p1-lavafluid-serverlevel-proof.init.gradle <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  options.compilerArgs += ['-Xmaxerrs', '10000']
              }
          }
          GRADLE

      - name: Compile standalone sources and preserve unrelated failure
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -uo pipefail
          set +e
          ./gradlew -I ../p1-lavafluid-serverlevel-proof.init.gradle \
            :common:compileJava :common:compileKotlin :fabric:compileJava :fabric:compileKotlin \
            --stacktrace --no-daemon 2>&1 | tee ../p1-lavafluid-serverlevel-proof.log
          status=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$status" > ../p1-lavafluid-serverlevel-gradle-status.txt
          echo "GRADLE_EXIT_STATUS=$status"
          exit 0

      - name: Prove exact Minecraft 26.2 LavaFluid randomTick API
        shell: bash
        run: |
          set -euo pipefail
          jar="$HOME/.gradle/caches/fabric-loom/26.2/minecraft-client.jar"
          test -f "$jar"
          javap -classpath "$jar" net.minecraft.world.level.material.LavaFluid | tee p1-lavafluid-serverlevel-javap.txt
          grep -Fq 'public void randomTick(net.minecraft.server.level.ServerLevel, net.minecraft.core.BlockPos, net.minecraft.world.level.material.FluidState, net.minecraft.util.RandomSource);' p1-lavafluid-serverlevel-javap.txt
          ! grep -Fq 'public void randomTick(net.minecraft.world.level.Level, net.minecraft.core.BlockPos, net.minecraft.world.level.material.FluidState, net.minecraft.util.RandomSource);' p1-lavafluid-serverlevel-javap.txt
          echo 'LAVAFLUID_26_2_RANDOMTICK_SERVERLEVEL_API_PROVEN'

      - name: Prove exact LavaFluid mixin file is compiler-clean
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          log = Path('p1-lavafluid-serverlevel-proof.log').read_text(encoding='utf-8', errors='replace')
          status = int(Path('p1-lavafluid-serverlevel-gradle-status.txt').read_text(encoding='utf-8').strip())
          if ':common:compileJava' not in log:
              raise SystemExit('fail-closed: common Java compile task was never reached')
          if status == 0:
              print('FULL_STANDALONE_COMPILE_GREEN')
          elif 'error:' not in log or 'Compilation failed' not in log:
              raise SystemExit('fail-closed: Gradle failed without a normal javac compilation frontier')
          if re.search(r'only showing the first\s+\d+\s+errors', log, flags=re.IGNORECASE):
              raise SystemExit('fail-closed: javac diagnostics were still capped')

          target = '/common/src/main/java/org/valkyrienskies/mod/mixin/feature/fire_between_ship_and_world/LavaFluidMixin.java:'
          lines = log.splitlines()
          target_errors = []
          for index, line in enumerate(lines):
              if 'error:' not in line or target not in line:
                  continue
              target_errors.append('\n'.join(lines[max(0, index - 2):index + 5]))
          if target_errors:
              raise SystemExit(
                  'fail-closed: LavaFluid ServerLevel unit still has compiler diagnostics:\n'
                  + '\n---\n'.join(target_errors)
              )

          unrelated = [line for line in lines if 'error:' in line]
          print(
              'LAVAFLUID_RANDOMTICK_SERVERLEVEL_CLUSTER_COMPILER_CLEAN '
              f'unrelated_error_diagnostics={len(unrelated)} gradle_status={status}'
          )
          PY

      - name: Upload LavaFluid ServerLevel proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-lavafluid-randomtick-serverlevel-proof-${{ github.sha }}
          path: |
            p1-lavafluid-serverlevel-proof.log
            p1-lavafluid-serverlevel-gradle-status.txt
            p1-lavafluid-serverlevel-javap.txt
          if-no-files-found: warn
