name: P1 standalone compile

on:
  push:
    paths:
      - 'scripts/apply_p1_build_baseline.py'
      - 'scripts/apply_p1_creativetab_output_access_26_2.py'
      - 'scripts/apply_p1_vskeybindings_category_26_2.py'
      - 'scripts/apply_p1_source_api_26_2.py'
      - 'scripts/apply_p1_getgravity_permission_26_2.py'
      - 'scripts/apply_p1_dry_permission_26_2.py'
      - 'scripts/apply_p1_rename_permission_26_2.py'
      - 'scripts/apply_p1_scale_permission_26_2.py'
      - 'scripts/apply_p1_splitting_permission_26_2.py'
      - 'scripts/apply_p1_static_permission_26_2.py'
      - 'scripts/apply_p1_teleport_permission_26_2.py'
      - 'scripts/apply_p1_delete_permission_26_2.py'
      - 'scripts/apply_p1_getship_permission_26_2.py'
      - 'scripts/apply_p1_remass_permission_26_2.py'
      - 'scripts/apply_p1_nullable_translation_args_26_2.py'
      - 'scripts/apply_p1_entitydragger_direction_26_2.py'
      - 'scripts/apply_p1_testchair_direction_26_2.py'
      - 'scripts/apply_p1_testchair_entity_creation_26_2.py'
      - 'scripts/apply_p1_emptyrenderer_identifier_26_2.py'
      - 'scripts/apply_p1_emptyrenderer_renderstate_26_2.py'
      - 'scripts/apply_p1_valkyrienskiesmod_identifier_26_2.py'
      - 'scripts/apply_p1_testhinge_getshape_signature_26_2.py'
      - 'scripts/apply_p1_testhinge_getticker_bound_26_2.py'
      - 'scripts/apply_p1_testhinge_onpaste_getlong_26_2.py'
      - 'scripts/apply_p1_testhinge_blockentity_getlong_26_2.py'
      - 'scripts/apply_p1_testhinge_blockentity_value_io_26_2.py'
      - 'scripts/apply_p1_testhinge_removal_hook_26_2.py'
      - 'scripts/apply_p1_shipsaveddata_bytearray_optional_26_2.py'
      - 'scripts/apply_p1_compatutil_center_26_2.py'
      - 'scripts/apply_p1_compatutil_buildheight_26_2.py'
      - 'scripts/apply_p1_compatutil_collision_context_26_2.py'
      - 'scripts/apply_p1_seamlesschunks_chunkpos_pack_26_2.py'
      - 'scripts/apply_p1_massdatapackresolver_miny_26_2.py'
      - 'scripts/apply_p1_massdatapackresolver_identifier_26_2.py'
      - 'scripts/apply_p1_massdatapackresolver_reload_listener_26_2.py'
      - 'scripts/apply_p1_massdatapackresolver_registry_tag_26_2.py'
      - 'scripts/apply_p1_dimensionparametersresolver_identifier_26_2.py'
      - 'scripts/apply_p1_dimensionparametersresolver_reload_listener_26_2.py'
      - 'scripts/apply_p1_vsentityhandlerdataloader_identifier_26_2.py'
      - 'scripts/apply_p1_vsentityhandlerdataloader_reload_listener_26_2.py'
      - 'scripts/apply_p1_vsgamepackets_identifier_26_2.py'
      - 'scripts/apply_p1_vsgameutils_resourcekey_identifier_26_2.py'
      - 'scripts/apply_p1_vsgameutils_height_chunkkey_26_2.py'
      - 'scripts/apply_p1_vsgameevents_rendertype_26_2.py'
      - 'scripts/apply_p1_entityhandler_projectile_packages_26_2.py'
      - 'scripts/apply_p1_shipmountingentity_value_io_26_2.py'
      - 'scripts/apply_p1_shipmountingentity_hurtserver_26_2.py'
      - 'scripts/apply_p1_shipmountingentity_kill_level_26_2.py'
      - '.github/workflows/p1-compile.yml'
      - 'upstream-vs2'
      - 'BASELINE_LOCK.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-26-2-compile-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Apply traceable P1 build-only overlay
        run: python3 scripts/apply_p1_build_baseline.py upstream-vs2

      - name: Apply traceable P1 CreativeModeTab Output access overlay
        run: python3 scripts/apply_p1_creativetab_output_access_26_2.py upstream-vs2

      - name: Apply traceable P1 Minecraft 26.2 source API overlay
        run: python3 scripts/apply_p1_source_api_26_2.py upstream-vs2

      - name: Apply traceable P1 VSKeyBindings Category overlay
        run: python3 scripts/apply_p1_vskeybindings_category_26_2.py upstream-vs2

      - name: Apply traceable P1 GetGravity permission overlay
        run: python3 scripts/apply_p1_getgravity_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Dry permission overlay
        run: python3 scripts/apply_p1_dry_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Rename permission overlay
        run: python3 scripts/apply_p1_rename_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Scale permission overlay
        run: python3 scripts/apply_p1_scale_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Splitting permission overlay
        run: python3 scripts/apply_p1_splitting_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Static permission overlay
        run: python3 scripts/apply_p1_static_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Teleport permission overlay
        run: python3 scripts/apply_p1_teleport_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Delete permission overlay
        run: python3 scripts/apply_p1_delete_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 GetShip permission overlay
        run: python3 scripts/apply_p1_getship_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 Remass permission overlay
        run: python3 scripts/apply_p1_remass_permission_26_2.py upstream-vs2

      - name: Apply traceable P1 nullable translation-argument overlay
        run: python3 scripts/apply_p1_nullable_translation_args_26_2.py upstream-vs2

      - name: Apply traceable P1 EntityDragger Direction overlay
        run: python3 scripts/apply_p1_entitydragger_direction_26_2.py upstream-vs2

      - name: Apply traceable P1 TestChair Direction overlay
        run: python3 scripts/apply_p1_testchair_direction_26_2.py upstream-vs2

      - name: Apply traceable P1 TestChair entity-creation overlay
        run: python3 scripts/apply_p1_testchair_entity_creation_26_2.py upstream-vs2

      - name: Apply traceable P1 EmptyRenderer Identifier overlay
        run: python3 scripts/apply_p1_emptyrenderer_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 EmptyRenderer render-state overlay
        run: python3 scripts/apply_p1_emptyrenderer_renderstate_26_2.py upstream-vs2

      - name: Apply traceable P1 ValkyrienSkiesMod Identifier overlay
        run: python3 scripts/apply_p1_valkyrienskiesmod_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHinge getShape signature overlay
        run: python3 scripts/apply_p1_testhinge_getshape_signature_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHinge getTicker generic-bound overlay
        run: python3 scripts/apply_p1_testhinge_getticker_bound_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHinge onPaste getLong overlay
        run: python3 scripts/apply_p1_testhinge_onpaste_getlong_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHingeBlockEntity getLong overlay
        run: python3 scripts/apply_p1_testhinge_blockentity_getlong_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHingeBlockEntity Value I/O overlay
        run: python3 scripts/apply_p1_testhinge_blockentity_value_io_26_2.py upstream-vs2

      - name: Apply traceable P1 TestHinge removal hook overlay
        run: python3 scripts/apply_p1_testhinge_removal_hook_26_2.py upstream-vs2

      - name: Apply traceable P1 ShipSavedData byte-array Optional overlay
        run: python3 scripts/apply_p1_shipsaveddata_bytearray_optional_26_2.py upstream-vs2

      - name: Apply traceable P1 CompatUtil center overlay
        run: python3 scripts/apply_p1_compatutil_center_26_2.py upstream-vs2

      - name: Apply traceable P1 CompatUtil build-height overlay
        run: python3 scripts/apply_p1_compatutil_buildheight_26_2.py upstream-vs2

      - name: Apply traceable P1 CompatUtil empty collision-context overlay
        run: python3 scripts/apply_p1_compatutil_collision_context_26_2.py upstream-vs2

      - name: Apply traceable P1 SeamlessChunksManager ChunkPos pack overlay
        run: python3 scripts/apply_p1_seamlesschunks_chunkpos_pack_26_2.py upstream-vs2

      - name: Apply traceable P1 MassDatapackResolver minY overlay
        run: python3 scripts/apply_p1_massdatapackresolver_miny_26_2.py upstream-vs2

      - name: Apply traceable P1 MassDatapackResolver Identifier overlay
        run: python3 scripts/apply_p1_massdatapackresolver_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 MassDatapackResolver reload-listener overlay
        run: python3 scripts/apply_p1_massdatapackresolver_reload_listener_26_2.py upstream-vs2

      - name: Apply traceable P1 MassDatapackResolver registry-tag overlay
        run: python3 scripts/apply_p1_massdatapackresolver_registry_tag_26_2.py upstream-vs2

      - name: Apply traceable P1 DimensionParametersResolver Identifier overlay
        run: python3 scripts/apply_p1_dimensionparametersresolver_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 DimensionParametersResolver reload-listener overlay
        run: python3 scripts/apply_p1_dimensionparametersresolver_reload_listener_26_2.py upstream-vs2

      - name: Apply traceable P1 VSEntityHandlerDataLoader Identifier overlay
        run: python3 scripts/apply_p1_vsentityhandlerdataloader_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 VSEntityHandlerDataLoader reload-listener overlay
        run: python3 scripts/apply_p1_vsentityhandlerdataloader_reload_listener_26_2.py upstream-vs2

      - name: Apply traceable P1 VSGamePackets Identifier overlay
        run: python3 scripts/apply_p1_vsgamepackets_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 VSGameUtils ResourceKey Identifier overlay
        run: python3 scripts/apply_p1_vsgameutils_resourcekey_identifier_26_2.py upstream-vs2

      - name: Apply traceable P1 VSGameUtils build-height and chunk-key overlay
        run: python3 scripts/apply_p1_vsgameutils_height_chunkkey_26_2.py upstream-vs2

      - name: Apply traceable P1 VSGameEvents RenderType overlay
        run: python3 scripts/apply_p1_vsgameevents_rendertype_26_2.py upstream-vs2

      - name: Apply traceable P1 entity-handler projectile package overlay
        run: python3 scripts/apply_p1_entityhandler_projectile_packages_26_2.py upstream-vs2

      - name: Apply traceable P1 ShipMountingEntity Value I/O overlay
        run: python3 scripts/apply_p1_shipmountingentity_value_io_26_2.py upstream-vs2

      - name: Apply traceable P1 ShipMountingEntity hurtServer overlay
        run: python3 scripts/apply_p1_shipmountingentity_hurtserver_26_2.py upstream-vs2

      - name: Apply traceable P1 ShipMountingEntity kill ServerLevel overlay
        run: python3 scripts/apply_p1_shipmountingentity_kill_level_26_2.py upstream-vs2

      - name: Show and validate port delta
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-vs2 diff --check
          git -C upstream-vs2 diff -- gradle.properties settings.gradle gradle/wrapper/gradle-wrapper.properties build.gradle fabric/build.gradle common/src/main/resources/valkyrienskies-common.accesswidener common/src/main/resources/assets/valkyrienskies/lang
          git -C upstream-vs2 diff -- common/src/main/kotlin/org/valkyrienskies/mod/api/datagen/VSBlockInfoDataProvider.kt common/src/main/kotlin/org/valkyrienskies/mod/api/datagen/VSShipyardEntityDataProvider.kt common/src/main/kotlin/org/valkyrienskies/mod/api/ValkyrienSkies.kt common/src/main/kotlin/org/valkyrienskies/mod/common/BlockStateInfoProvider.kt common/src/main/kotlin/org/valkyrienskies/mod/client/audio/SimpleSoundInstanceOnShip.kt common/src/main/kotlin/org/valkyrienskies/mod/common/entity/handling/VSEntityManager.kt common/src/main/kotlin/org/valkyrienskies/mod/util/EntityData.kt common/src/main/kotlin/org/valkyrienskies/mod/util/NbtUtil.kt common/src/main/kotlin/org/valkyrienskies/mod/util/VectorConversionsMC.kt common/src/main/kotlin/org/valkyrienskies/mod/common/block/TestFlapBlock.kt common/src/main/kotlin/org/valkyrienskies/mod/common/block/TestWingBlock.kt common/src/main/kotlin/org/valkyrienskies/mod/common/blockentity/TestThrusterBlockEntity.kt common/src/main/kotlin/org/valkyrienskies/mod/common/block/TestThrusterBlock.kt common/src/main/kotlin/org/valkyrienskies/mod/common/world/RaycastUtils.kt common/src/main/kotlin/org/valkyrienskies/mod/common/util/MinecraftPlayer.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/BackendCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/GetAirCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/GetGravityCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/DryCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/RenameCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/ScaleCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/SplittingCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/StaticCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/TeleportCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/DeleteCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/GetShipCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/command/commands/RemassCommand.kt common/src/main/kotlin/org/valkyrienskies/mod/common/util/EntityDragger.kt common/src/main/kotlin/org/valkyrienskies/mod/common/block/TestChairBlock.kt common/src/main/kotlin/org/valkyrienskies/mod/client/EmptyRenderer.kt common/src/main/kotlin/org/valkyrienskies/mod/common/ValkyrienSkiesMod.kt common/src/main/kotlin/org/valkyrienskies/mod/common/ShipSavedData.kt common/src/main/kotlin/org/valkyrienskies/mod/common/CompatUtil.kt common/src/main/kotlin/org/valkyrienskies/mod/common/block/TestHingeBlock.kt common/src/main/kotlin/org/valkyrienskies/mod/common/blockentity/TestHingeBlockEntity.kt common/src/main/kotlin/org/valkyrienskies/mod/common/assembly/SeamlessChunksManager.kt common/src/main/kotlin/org/valkyrienskies/mod/common/config/MassDatapackResolver.kt common/src/main/kotlin/org/valkyrienskies/mod/common/config/DimensionParametersResolver.kt common/src/main/kotlin/org/valkyrienskies/mod/common/config/VSEntityHandlerDataLoader.kt common/src/main/kotlin/org/valkyrienskies/mod/common/config/VSKeyBindings.kt common/src/main/kotlin/org/valkyrienskies/mod/common/networking/VSGamePackets.kt common/src/main/kotlin/org/valkyrienskies/mod/common/VSGameUtils.kt
          git -C upstream-vs2 diff -- common/src/main/kotlin/org/valkyrienskies/mod/common/hooks/VSGameEvents.kt
          git -C upstream-vs2 diff -- common/src/main/kotlin/org/valkyrienskies/mod/common/entity/handling/AbstractShipyardEntityHandler.kt common/src/main/kotlin/org/valkyrienskies/mod/common/entity/handling/WorldEntityHandler.kt
          git -C upstream-vs2 diff -- common/src/main/kotlin/org/valkyrienskies/mod/common/entity/ShipMountingEntity.kt
          git -C upstream-vs2 diff -- common/src/main/kotlin/org/valkyrienskies/mod/common/item/ShipAssemblerItem.kt common/src/main/kotlin/org/valkyrienskies/mod/common/item/ShipCreatorItem.kt common/src/main/kotlin/org/valkyrienskies/mod/common/item/ShipRemoverItem.kt
          git -C upstream-vs2 diff -- common/src/main/java/org/valkyrienskies/mod/mixin/accessors/resource/ResourceKeyAccessor.java common/src/main/java/org/valkyrienskies/mod/mixin/world/level/MixinLevel.java
          git -C upstream-vs2 status --short -- common/src/main/java/org/valkyrienskies/mod/common/util/NullableTranslatableCompat.java
          test -f upstream-vs2/common/src/main/java/org/valkyrienskies/mod/common/util/NullableTranslatableCompat.java
          sed -n '1,220p' upstream-vs2/common/src/main/java/org/valkyrienskies/mod/common/util/NullableTranslatableCompat.java

      - name: Show Gradle runtime
        working-directory: upstream-vs2
        run: ./gradlew --version

      - name: Compile standalone common + Fabric sources
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -o pipefail
          ./gradlew :common:compileJava :common:compileKotlin :fabric:compileJava :fabric:compileKotlin --stacktrace --no-daemon 2>&1 | tee ../p1-compile.log

      - name: Upload compile diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-compile-log-${{ github.sha }}
          path: p1-compile.log
          if-no-files-found: error
