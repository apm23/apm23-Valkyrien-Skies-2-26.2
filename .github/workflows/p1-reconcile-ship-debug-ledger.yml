name: P1 reconcile ship debug boundary ledger

on:
  push:
    paths:
      - '.github/workflows/p1-reconcile-ship-debug-ledger.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-ledger:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Reconcile MASTER_STATE fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/reconcile_ship_debug_boundary_ledger.py
          git diff --check -- MASTER_STATE.md
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "MASTER_STATE.md"
          grep -Fq 'canonical implementation HEAD: `7728fb1bb9f44b417039e1d3510b761c659564b7`' MASTER_STATE.md
          grep -Fq 'artifact `10593368657`' MASTER_STATE.md
          grep -Fq 'feature/world_weather/MixinLevelRenderer.java' MASTER_STATE.md

      - name: Commit ledger only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MASTER_STATE.md
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = "MASTER_STATE.md"
          git commit -m 'docs: freeze ship debug boundary and classify next frontier'
          git push origin HEAD:main
