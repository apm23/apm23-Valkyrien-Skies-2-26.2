name: P1 canonicalize world weather center

on:
  push:
    paths:
      - '.github/workflows/p1-canonicalize-world-weather-center.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-canonical-p1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Build checksumable canonical workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          src = Path('.github/workflows/p1-compile.yml')
          text = src.read_text(encoding='utf-8')
          candidate = 'apply_p1_world_weather_blockpos_center_26_2.py'
          if candidate in text:
              raise SystemExit('fail-closed: world-weather center overlay already canonical')

          path_anchor = "      - 'scripts/apply_p1_ship_debug_overlay_blockpos_center_26_2.py'\n"
          if text.count(path_anchor) != 1:
              raise SystemExit(f'fail-closed: path anchor count={text.count(path_anchor)}')
          text = text.replace(
              path_anchor,
              path_anchor + "      - 'scripts/apply_p1_world_weather_blockpos_center_26_2.py'\n",
              1,
          )

          step_anchor = (
              '      - name: Apply frozen P1 ship debug overlay BlockPos center overlay\n'
              '        run: python3 scripts/apply_p1_ship_debug_overlay_blockpos_center_26_2.py upstream-vs2\n'
          )
          if text.count(step_anchor) != 1:
              raise SystemExit(f'fail-closed: step anchor count={text.count(step_anchor)}')
          text = text.replace(
              step_anchor,
              step_anchor
              + '\n      - name: Apply frozen P1 world weather BlockPos center overlay\n'
                '        run: python3 scripts/apply_p1_world_weather_blockpos_center_26_2.py upstream-vs2\n',
              1,
          )

          if text.count(candidate) != 2:
              raise SystemExit(f'fail-closed: staged candidate occurrence count={text.count(candidate)}')
          if text.count('Apply frozen P1 world weather BlockPos center overlay') != 1:
              raise SystemExit('fail-closed: staged world-weather step name count mismatch')

          out = Path('.ci-transport/p1-compile.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(text, encoding='utf-8')
          print('P1_WORLD_WEATHER_CANONICAL_STAGING_READY')
          PY
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('.ci-transport/p1-compile.yml')
          data = p.read_bytes()
          print('STAGED_SHA256=' + hashlib.sha256(data).hexdigest())
          print('STAGED_BYTES=' + str(len(data)))
          PY
          test "$(grep -Fc 'apply_p1_world_weather_blockpos_center_26_2.py' .ci-transport/p1-compile.yml)" -eq 2
          git diff --no-index -- .github/workflows/p1-compile.yml .ci-transport/p1-compile.yml || test "$?" -eq 1

      - name: Commit non-workflow staging blob only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-transport/p1-compile.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = ".ci-transport/p1-compile.yml"
          git commit -m 'ci: stage world weather canonical workflow blob'
          git push origin HEAD:main
