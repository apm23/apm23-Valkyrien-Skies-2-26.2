name: P1 optional Create deployer exclusion probe

on:
  push:
    paths:
      - 'scripts/apply_p1_deployer_scroll_option_exclusion_26_2.py'
      - '.github/workflows/p1-deployer-exclusion-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployer-exclusion-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical frozen P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shlex
          import subprocess

          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(
              r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$',
              workflow,
              flags=re.MULTILINE,
          )
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          if any('deployer_scroll_option_exclusion_26_2.py' in command for command in commands):
              raise SystemExit('fail-closed: deployer exclusion is already canonical; retire this probe instead')
          print(f'Replaying {len(commands)} canonical overlay commands')
          for command in commands:
              print('+', command)
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Reapply frozen renderer-handler proof overlay
        run: python3 scripts/apply_p1_entityhandler_renderstate_26_2.py upstream-vs2

      - name: Reapply frozen Sable compile-boundary proof overlay
        run: python3 scripts/apply_p1_sable_companion_compileonly_26_2.py upstream-vs2

      - name: Apply isolated optional Create deployer exclusion
        run: python3 scripts/apply_p1_deployer_scroll_option_exclusion_26_2.py upstream-vs2

      - name: Validate exact one-file Create exclusion
        shell: bash
        run: |
          set -euo pipefail
          git -C upstream-vs2 diff --check
          git -C upstream-vs2 diff -- common/build.gradle
          test "$(grep -Fc 'exclude "org/valkyrienskies/mod/compat/create/DeployerScrollOptionSlot.kt"' upstream-vs2/common/build.gradle)" -eq 1
          if grep -Fq 'exclude "org/valkyrienskies/mod/compat/create/**"' upstream-vs2/common/build.gradle; then
            echo 'Broad Create compatibility exclusion is forbidden in this probe' >&2
            exit 1
          fi
          test -f upstream-vs2/common/src/main/java/org/valkyrienskies/mod/compat/create/DeployerScrollOptionSlot.kt

      - name: Show Gradle runtime
        working-directory: upstream-vs2
        run: ./gradlew --version

      - name: Compile standalone common + Fabric sources
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -o pipefail
          ./gradlew :common:compileJava :common:compileKotlin :fabric:compileJava :fabric:compileKotlin --stacktrace --no-daemon 2>&1 | tee ../p1-deployer-exclusion-probe.log

      - name: Upload deployer exclusion probe diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-deployer-exclusion-probe-${{ github.sha }}
          path: p1-deployer-exclusion-probe.log
          if-no-files-found: warn
