name: P1 vanilla renderer chunk transform inspection
# Inspection-only proof for current Minecraft 26.2 terrain visibility/uniform authority.
# Never mutates pinned upstream VS2 source.

on:
  push:
    paths:
      - '.github/workflows/p1-vanilla-renderer-chunk-transform-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-chunk-transform-authority:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact upstream baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Replay canonical P1 overlays in canonical order
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, shlex, subprocess
          workflow = Path('.github/workflows/p1-compile.yml').read_text(encoding='utf-8')
          commands = re.findall(r'^\s*run:\s+(python3 scripts/apply_p1_[^\n]+ upstream-vs2)\s*$', workflow, flags=re.MULTILINE)
          if len(commands) < 50:
              raise SystemExit(f'fail-closed: expected canonical overlay chain, found only {len(commands)} commands')
          for command in commands:
              subprocess.run(shlex.split(command), check=True)
          PY

      - name: Verify pinned upstream target identity
        shell: bash
        run: |
          set -euo pipefail
          target='common/src/main/java/org/valkyrienskies/mod/mixin/mod_compat/vanilla_renderer/MixinLevelRendererVanilla.java'
          actual="$(git -C upstream-vs2 hash-object "$target")"
          test "$actual" = '824e1ac56a99bc6480cc80c32c085d18c2425b09'
          echo "VANILLA_RENDERER_UPSTREAM_BLOB=$actual"

      - name: Resolve exact common compile classpath
        shell: bash
        working-directory: upstream-vs2
        run: |
          set -euo pipefail
          cat > ../p1-vanilla-chunk-transform-classpath.init.gradle <<'GRADLE'
          gradle.projectsEvaluated {
              def commonProject = gradle.rootProject.findProject(':common')
              if (commonProject == null) throw new GradleException('fail-closed: :common project not found')
              commonProject.tasks.register('vsPrintMainCompileClasspath') {
                  doLast {
                      def sourceSets = commonProject.extensions.findByName('sourceSets')
                      if (sourceSets == null) throw new GradleException('fail-closed: sourceSets extension not found on :common')
                      sourceSets.getByName('main').compileClasspath.files.each { file -> println('VS_CP_FILE=' + file.absolutePath) }
                  }
              }
          }
          GRADLE
          ./gradlew -I ../p1-vanilla-chunk-transform-classpath.init.gradle :common:vsPrintMainCompileClasspath --no-daemon \
            | tee ../p1-vanilla-chunk-transform-classpath.log
          grep -q '^VS_CP_FILE=' ../p1-vanilla-chunk-transform-classpath.log

      - name: Inspect exact visibility and chunk uniform authority
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee p1-vanilla-renderer-chunk-transform-probe.log
          from pathlib import Path
          import subprocess, zipfile

          cp_log = Path('p1-vanilla-chunk-transform-classpath.log').read_text(encoding='utf-8', errors='replace')
          jars = []
          for line in cp_log.splitlines():
              if line.startswith('VS_CP_FILE='):
                  p = Path(line.split('=', 1)[1])
                  if p.exists() and p.suffix == '.jar':
                      jars.append(p)
          owners = []
          for jar in jars:
              try:
                  with zipfile.ZipFile(jar) as zf:
                      if 'net/minecraft/client/renderer/LevelRenderer.class' in zf.namelist():
                          owners.append(jar)
              except zipfile.BadZipFile:
                  pass
          if len(owners) != 1:
              raise SystemExit(f'fail-closed: expected one mapped MC owner jar, got {len(owners)}')
          owner = owners[0]
          print('MC_OWNER', owner)

          classes = [
              'net.minecraft.client.renderer.LevelRenderer',
              'net.minecraft.client.renderer.SectionOcclusionGraph',
              'net.minecraft.client.renderer.DynamicUniforms',
              'net.minecraft.client.renderer.DynamicUniforms$ChunkSectionInfo',
              'net.minecraft.client.renderer.chunk.ChunkSectionsToRender',
              'net.minecraft.client.renderer.chunk.ChunkSectionLayer',
              'net.minecraft.client.renderer.chunk.SectionMesh',
              'net.minecraft.client.renderer.chunk.SectionMesh$SectionDraw',
              'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection',
              'net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSectionBufferSlice',
              'net.minecraft.client.renderer.state.level.CameraRenderState',
              'net.minecraft.client.renderer.state.level.LevelRenderState',
              'net.minecraft.client.renderer.ViewArea',
              'com.mojang.blaze3d.pipeline.RenderPipeline',
              'com.mojang.blaze3d.systems.RenderPass',
          ]
          outputs = {}
          for cls in classes:
              proc = subprocess.run(['javap','-classpath',str(owner),'-p','-s','-c',cls], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              print('\n=== JAVAP', cls, '===')
              print(proc.stdout)
              if proc.returncode != 0:
                  raise SystemExit(f'fail-closed: javap failed for {cls}')
              outputs[cls] = proc.stdout

          level = outputs['net.minecraft.client.renderer.LevelRenderer']
          uniforms = outputs['net.minecraft.client.renderer.DynamicUniforms$ChunkSectionInfo']
          occlusion = outputs['net.minecraft.client.renderer.SectionOcclusionGraph']
          view = outputs['net.minecraft.client.renderer.ViewArea']
          render_section = outputs['net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection']

          required = {
              'prepareChunkRenders': 'prepareChunkRenders(org.joml.Matrix4fc)',
              'chunkSectionInfoCtor': 'net.minecraft.client.renderer.DynamicUniforms$ChunkSectionInfo(org.joml.Matrix4fc, int, int, int, float, int, int)',
              'renderSectionOrigin': 'getRenderOrigin()',
              'renderSectionNode': 'setSectionNode(long)',
          }
          haystacks = {
              'prepareChunkRenders': level,
              'chunkSectionInfoCtor': uniforms,
              'renderSectionOrigin': render_section,
              'renderSectionNode': render_section,
          }
          for key, needle in required.items():
              if needle not in haystacks[key]:
                  raise SystemExit(f'fail-closed: required current boundary changed: {key} -> {needle}')

          print('SECTION_OCCLUSION_PUBLIC_API_BEGIN')
          for line in occlusion.splitlines():
              if line.strip().startswith(('public ', 'void ', 'boolean ')):
                  print(line.strip())
          print('SECTION_OCCLUSION_PUBLIC_API_END')
          print('VIEWAREA_PUBLIC_API_BEGIN')
          for line in view.splitlines():
              if line.strip().startswith(('public ', 'protected ')):
                  print(line.strip())
          print('VIEWAREA_PUBLIC_API_END')
          print('VANILLA_RENDERER_26_2_CHUNK_TRANSFORM_AUTHORITY_INSPECTED prepare_chunk_renders=true chunk_section_uniform=true')
          PY

      - name: Upload exact chunk transform inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1-vanilla-renderer-chunk-transform-probe-${{ github.sha }}
          path: |
            p1-vanilla-chunk-transform-classpath.log
            p1-vanilla-renderer-chunk-transform-probe.log
          if-no-files-found: warn
