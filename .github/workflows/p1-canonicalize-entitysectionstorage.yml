name: P1 canonicalize EntitySectionStorage client accessor
# One-shot recovery harness; generated canonical commit deletes this workflow.

on:
  push:
    paths:
      - '.github/workflows/p1-canonicalize-entitysectionstorage.yml'

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout triggering HEAD
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Canonicalize proven EntitySectionStorage unit fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          compile_path = Path('.github/workflows/p1-compile.yml')
          self_path = Path('.github/workflows/p1-canonicalize-entitysectionstorage.yml')
          text = compile_path.read_text(encoding='utf-8')
          script = 'scripts/apply_p1_entitysectionstorage_client_accessor_26_2.py'
          command = 'python3 scripts/apply_p1_entitysectionstorage_client_accessor_26_2.py upstream-vs2'

          if script in text or command in text:
              raise SystemExit('fail-closed: EntitySectionStorage overlay already canonicalized')

          old_paths = "      - 'scripts/apply_p1_particle_collision_client_accessor_26_2.py'\n      - '.github/workflows/p1-compile.yml'\n"
          new_paths = "      - 'scripts/apply_p1_particle_collision_client_accessor_26_2.py'\n      - 'scripts/apply_p1_entitysectionstorage_client_accessor_26_2.py'\n      - '.github/workflows/p1-compile.yml'\n"
          if text.count(old_paths) != 1:
              raise SystemExit(f'fail-closed: canonical path anchor count={text.count(old_paths)}')
          text = text.replace(old_paths, new_paths, 1)

          old_steps = "      - name: Apply frozen P1 particle collision Level client accessor overlay\n        run: python3 scripts/apply_p1_particle_collision_client_accessor_26_2.py upstream-vs2\n\n      - name: Show and validate port delta\n"
          new_steps = "      - name: Apply frozen P1 particle collision Level client accessor overlay\n        run: python3 scripts/apply_p1_particle_collision_client_accessor_26_2.py upstream-vs2\n\n      - name: Apply frozen P1 EntitySectionStorage Level client accessor overlay\n        run: python3 scripts/apply_p1_entitysectionstorage_client_accessor_26_2.py upstream-vs2\n\n      - name: Show and validate port delta\n"
          if text.count(old_steps) != 1:
              raise SystemExit(f'fail-closed: canonical step anchor count={text.count(old_steps)}')
          text = text.replace(old_steps, new_steps, 1)

          if text.count(script) != 2:
              raise SystemExit(f'fail-closed: expected script twice (path+command), found {text.count(script)}')
          if text.count(command) != 1:
              raise SystemExit(f'fail-closed: expected command once, found {text.count(command)}')

          compile_path.write_text(text, encoding='utf-8')
          if not self_path.is_file():
              raise SystemExit('fail-closed: temporary canonicalizer missing')
          self_path.unlink()
          PY

          git diff --check
          git diff -- .github/workflows/p1-compile.yml .github/workflows/p1-canonicalize-entitysectionstorage.yml

      - name: Commit canonical repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'apm23'
          git config user.email '80390905+apm23@users.noreply.github.com'
          git add .github/workflows/p1-compile.yml
          git add -u .github/workflows/p1-canonicalize-entitysectionstorage.yml
          git commit -m 'ci: canonicalize EntitySectionStorage Level client accessor overlay'
          git push origin HEAD:main
