name: P1 stage validated tick ship chunks canonical blob

on:
  push:
    paths:
      - '.github/workflows/p1-canonicalize-tick-ship-chunks.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  stage-canonical-blob:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact repository state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Fetch and verify exact validated canonical artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/10593972064/zip" \
            -o canonical.zip
          test "$(sha256sum canonical.zip | awk '{print $1}')" = "383548bd9bfb74f6c2ea1170051d460d9c60354d649997452b6e398735fa943d"
          rm -rf canonical-artifact
          mkdir canonical-artifact
          unzip -q canonical.zip -d canonical-artifact
          test -f canonical-artifact/canonical-p1-compile.yml
          test "$(sha256sum canonical-artifact/canonical-p1-compile.yml | awk '{print $1}')" = "6ec72f0a9ca2568bcc490e0fefc7cb3571131c3d79844e4fa33a340fa7af65d3"
          test "$(grep -Fc "'scripts/apply_p1_tick_ship_chunks_chunkpos_accessors_26_2.py'" canonical-artifact/canonical-p1-compile.yml)" -eq 1
          test "$(grep -Fc 'python3 scripts/apply_p1_tick_ship_chunks_chunkpos_accessors_26_2.py upstream-vs2' canonical-artifact/canonical-p1-compile.yml)" -eq 1

      - name: Push non-workflow staging blob only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-transport
          cp canonical-artifact/canonical-p1-compile.yml .ci-transport/p1-compile.yml
          test "$(sha256sum .ci-transport/p1-compile.yml | awk '{print $1}')" = "6ec72f0a9ca2568bcc490e0fefc7cb3571131c3d79844e4fa33a340fa7af65d3"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-transport/p1-compile.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = '.ci-transport/p1-compile.yml'
          git diff --cached --check
          git commit -m 'ci: stage validated tick ship chunks canonical blob'
          git push origin HEAD:main
