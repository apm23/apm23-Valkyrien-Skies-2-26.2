name: P1 LavaFluid canonicalizer staging

on:
  push:
    paths:
      - '.github/workflows/p1-lavafluid-canonicalizer-staging.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage-canonical-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and validate exact canonical P1 workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import difflib

          src = Path('.github/workflows/p1-compile.yml')
          text = src.read_text(encoding='utf-8')
          candidate_path = "      - 'scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py'\n"
          candidate_name = '      - name: Apply frozen P1 LavaFluid randomTick ServerLevel overlay\n'
          candidate_run = '        run: python3 scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py upstream-vs2\n'

          if candidate_path in text or candidate_run in text:
              raise SystemExit('fail-closed: LavaFluid candidate is already canonical')

          path_anchor = "      - 'scripts/apply_p1_clip_replace_direction_26_2.py'\n"
          if text.count(path_anchor) != 1:
              raise SystemExit(f'fail-closed: clip-replace path anchor count={text.count(path_anchor)}')
          text2 = text.replace(path_anchor, path_anchor + candidate_path, 1)

          apply_anchor = (
              '      - name: Apply frozen P1 clip-replace Direction vocabulary overlay\n'
              '        run: python3 scripts/apply_p1_clip_replace_direction_26_2.py upstream-vs2\n'
          )
          if text2.count(apply_anchor) != 1:
              raise SystemExit(f'fail-closed: clip-replace apply anchor count={text2.count(apply_anchor)}')
          candidate_block = '\n' + candidate_name + candidate_run
          staged = text2.replace(apply_anchor, apply_anchor + candidate_block, 1)

          if staged.count(candidate_path) != 1 or staged.count(candidate_run) != 1 or staged.count(candidate_name) != 1:
              raise SystemExit('fail-closed: candidate canonical insertion count mismatch')

          added = []
          removed = []
          for line in difflib.ndiff(text.splitlines(), staged.splitlines()):
              if line.startswith('+ '):
                  if line[2:].strip(): added.append(line[2:])
              elif line.startswith('- '):
                  if line[2:].strip(): removed.append(line[2:])
          expected = [candidate_path.rstrip('\n'), candidate_name.rstrip('\n'), candidate_run.rstrip('\n')]
          if added != expected or removed:
              raise SystemExit(f'fail-closed: unexpected canonical delta added={added!r} removed={removed!r}')

          out = Path('.ci-transport/p1-compile.yml')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(staged, encoding='utf-8')
          print('STAGED_SHA256=' + hashlib.sha256(staged.encode()).hexdigest())
          print('STAGED_BYTES=' + str(len(staged.encode())))
          PY

          git diff --no-index -- .github/workflows/p1-compile.yml .ci-transport/p1-compile.yml || status=$?
          test "${status:-1}" -eq 1
          grep -Fq "scripts/apply_p1_lavafluid_randomtick_serverlevel_26_2.py" .ci-transport/p1-compile.yml
          grep -Fq "Apply frozen P1 LavaFluid randomTick ServerLevel overlay" .ci-transport/p1-compile.yml

      - name: Commit only validated non-workflow staging blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci-transport/p1-compile.yml
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          test "$(git diff --cached --name-only)" = '.ci-transport/p1-compile.yml'
          git commit -m 'ci: stage LavaFluid canonical p1 workflow blob'
          git push origin HEAD:main
